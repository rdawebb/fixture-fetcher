name: Build fixture calendars

on:
  # Run once a day + allow manual trigger
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Season-scoped so the team list can never outlive a promotion/relegation
      # cycle: Actions caches are immutable, so a static key would pin the very
      # first run's teams.yaml forever. Rolls over on 1 July.
      - name: Compute season
        id: season
        run: echo "season=$(date -d '-6 months' +%Y)" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: data/cache
          key: team-cache-${{ runner.os }}-${{ steps.season.outputs.season }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install Python dependencies
        run: |
          uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Node.js dependencies
        run: |
          npm ci

      - name: Fetch previously deployed calendar
        run: |
          mkdir -p public-old
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }}.git public-old || true

      - name: Generate ICS calendars
        id: generate
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p public
          uv run scripts/build_calendars.py

      - name: Validate build output
        run: |
          if [ "${{ steps.generate.outputs.no_fixtures }}" = "true" ]; then
            echo "⏸️ Off-season: no upcoming fixtures, skipping calendar validation"
            exit 0
          fi
          if [ -z "$(find public/calendars -type f -name '*.ics' 2>/dev/null)" ]; then
            echo "❌ No calendars were generated"
            exit 1
          fi
          echo "✅ At least one calendar generated successfully"

      - name: Copy static files
        run: node scripts/build_site.js

      - name: Check for calendar or static file changes
        id: changes
        if: success()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run scripts/compare_calendars.py
          uv run scripts/compare_static_files.py

      - name: Save cache
        uses: actions/cache@v6
        with:
          path: data/cache
          key: team-cache-${{ runner.os }}-${{ steps.season.outputs.season }}

      - name: Deploy to GitHub Pages
        if: success() && (steps.changes.outputs.has_changes == 'true' || steps.changes.outputs.static_changed == 'true')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
